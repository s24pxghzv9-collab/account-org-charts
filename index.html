<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Account Org Charts</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --ink: #1c2330; --muted: #667085; --line: #e3e6eb;
    --accent: #2457d6; --green: #1a7f4b; --amber: #b25e09; --blue: #2457d6; --grey: #8a94a6; --red: #b42318;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: #101828; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  header button, header label.btn, header a.btn { background: #ffffff1a; color: #fff; border: 1px solid #ffffff33; border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  header button:hover, header label.btn:hover { background: #ffffff2e; }
  nav { display: flex; gap: 4px; padding: 0 24px; background: #101828; overflow-x: auto; }
  nav button { background: none; border: 0; color: #c0c6d1; padding: 10px 14px; font: inherit; font-weight: 500; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  nav button.active { color: #fff; border-bottom-color: #5b8cff; }
  nav .stage-dot { display: inline-block; font-size: 11px; color: #98a2b3; margin-left: 6px; font-weight: 400; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }
  .layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; font-size: 12px; color: var(--muted); }
  .top { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; position: relative; padding-bottom: 18px; }
  .top::after { content: ""; position: absolute; left: 50%; bottom: 0; height: 18px; border-left: 2px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; border-top: 2px solid var(--line); padding-top: 18px; }
  .person { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--grey); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .top .person { width: 340px; max-width: 100%; }
  .top .person.side { width: 260px; }
  .person.s-verified { border-left-color: var(--green); }
  .person.s-corrected { border-left-color: var(--blue); }
  .person.s-partial { border-left-color: var(--amber); }
  .person.s-unverified { border-left-color: var(--grey); }
  .person.s-vacant { border-left-color: var(--grey); border-style: dashed; border-left-style: solid; background: #fafbfc; }
  .person .name { font-weight: 650; font-size: 15px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .person .title { font-weight: 500; }
  .person .remit { color: var(--muted); font-size: 12.5px; }
  .person .evidence { font-size: 11.5px; color: var(--muted); font-style: italic; }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; border: 1px solid; }
  .b-verified { color: var(--green); border-color: #a6d9bd; background: #eefaf3; }
  .b-corrected { color: var(--blue); border-color: #b3c7f5; background: #eef3ff; }
  .b-partial { color: var(--amber); border-color: #f2c99a; background: #fff6ec; }
  .b-unverified { color: #555f70; border-color: #d0d5dd; background: #f4f5f7; }
  .b-vacant { color: #555f70; border-color: #d0d5dd; background: #fff; border-style: dashed; }
  .b-new { color: #fff; background: var(--accent); border-color: var(--accent); }
  .rel { display: flex; gap: 6px; align-items: center; margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .rel select { font: inherit; font-size: 12px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 5px; background: #fff; }
  .rel input { flex: 1; min-width: 0; font: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; }
  .rel select[data-v="Champion"] { background: #eefaf3; color: var(--green); }
  .rel select[data-v="Engaged"], .rel select[data-v="Met"] { background: #eef3ff; color: var(--blue); }
  .rel select[data-v="Blocker"] { background: #fef3f2; color: var(--red); }
  h3.section { font-size: 13px; color: var(--muted); margin: 24px 0 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  @media (max-width: 700px) { .boxes { grid-template-columns: 1fr; } }
  .boxes ol, .boxes ul { margin: 0; padding-left: 18px; }
  .boxes li { margin: 3px 0; }
  .warn { background: #fff8f0; border-color: #f2d4b0; }
  .side-panel { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 12px; }
  .side-panel label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; font-weight: 500; }
  .side-panel select, .side-panel input, .side-panel textarea { width: 100%; font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .side-panel textarea { resize: vertical; min-height: 70px; }
  .side-panel button.primary { margin-top: 8px; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 12px; font: inherit; font-weight: 500; cursor: pointer; }
  .log { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; }
  .log li { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; position: relative; }
  .log .d { font-size: 11.5px; color: var(--muted); }
  .log .t { white-space: pre-wrap; }
  .log .x { position: absolute; right: 0; top: 0; border: 0; background: none; color: var(--grey); cursor: pointer; font-size: 14px; }
  .log .x:hover { color: var(--red); }
  .empty { color: var(--muted); font-size: 12.5px; font-style: italic; }
  .saved { font-size: 11.5px; color: var(--green); margin-left: 8px; opacity: 0; transition: opacity .3s; }
  .saved.on { opacity: 1; }
  .foot { margin-top: 28px; font-size: 12px; color: var(--muted); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar .meta { margin: 0; flex: 1; min-width: 200px; }
  .btn2 { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
  .btn2:hover { background: #f0f2f5; }
  .btn2.blue { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn2.blue:hover { background: #1c47b3; }
  .btn2.danger { color: var(--red); }
  .person { position: relative; }
  .person .edit { position: absolute; top: 6px; right: 6px; border: 0; background: none; cursor: pointer; color: var(--grey); font-size: 14px; padding: 2px 5px; border-radius: 4px; }
  .person .edit:hover { background: #f0f2f5; color: var(--ink); }
  .person .name { padding-right: 22px; }
  .person.hl { box-shadow: inset 0 0 0 1px #c9d7fb; }
  .contacts { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; }
  .contacts a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
  .contacts a:hover { text-decoration: underline; }
  .addcard { border: 2px dashed var(--line); border-radius: 8px; background: none; color: var(--muted); font: inherit; cursor: pointer; min-height: 80px; }
  .addcard:hover { border-color: var(--accent); color: var(--accent); }
  dialog { border: 0; border-radius: 12px; padding: 0; width: min(560px, 94vw); box-shadow: 0 20px 60px #0004; }
  dialog::backdrop { background: #10182866; }
  dialog form { padding: 18px 20px; }
  dialog h3 { margin: 0 0 12px; font-size: 16px; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .fgrid .full { grid-column: 1 / -1; }
  .fgrid label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .fgrid label.chk { flex-direction: row; align-items: center; gap: 6px; color: var(--ink); font-size: 13px; }
  .fgrid input:not([type=checkbox]), .fgrid select, .fgrid textarea { font: inherit; font-size: 13.5px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); }
  .fgrid textarea { min-height: 60px; resize: vertical; }
  .fgrid .sep { grid-column: 1 / -1; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; font-weight: 600; }
  .dlg-actions { display: flex; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
  .dlg-actions .spacer { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>Account Org Charts</h1>
  <span class="spacer"></span>
  <button id="addAccountBtn">+ Account</button>
  <button id="exportAllBtn" title="One slide per account">Export all to PowerPoint</button>
  <button id="exportBtn" title="Download everything (people, contacts, notes) as a JSON backup">Backup</button>
  <label class="btn" title="Restore from a JSON backup">Restore<input type="file" id="importFile" accept="application/json" hidden></label>
  <a class="btn" href="/logout" style="text-decoration:none" title="Sign out">Sign out</a>
</header>
<nav id="tabs"></nav>
<main id="app"></main>

<dialog id="personDlg"><form method="dialog" id="personForm">
  <h3 id="personDlgTitle">Edit person</h3>
  <div class="fgrid">
    <label>Name<input name="name" required></label>
    <label>Title<input name="title"></label>
    <label class="full">Remit / notes on role<input name="remit"></label>
    <label>Position on chart<select name="position">
      <option value="leader">Leader (top box)</option><option value="sidekick">Chief of staff (beside leader)</option>
      <option value="report">Direct report</option><option value="adjacent">Adjacent / influencer (not on slide)</option></select></label>
    <label>Validation<select name="status">
      <option value="verified">Verified</option><option value="corrected">Corrected</option><option value="partial">Partly verified</option>
      <option value="unverified">Unverified</option><option value="vacant">Vacant / TBC</option></select></label>
    <label class="full">Evidence / source<input name="evidence"></label>
    <label class="chk"><input type="checkbox" name="isNew"> “NEW” label</label>
    <label class="chk"><input type="checkbox" name="highlight"> Blue accent bar</label>
    <div class="sep">Contact details</div>
    <label>Email<input name="email" type="email" placeholder="name@company.com"></label>
    <label>Phone<input name="phone" type="tel"></label>
    <label class="full">LinkedIn URL<input name="linkedin" placeholder="https://www.linkedin.com/in/…"></label>
  </div>
  <div class="dlg-actions">
    <button type="button" class="btn2 danger" id="delPerson">Delete</button>
    <button type="button" class="btn2" id="moveUp" title="Move earlier in the row">◀ Move</button>
    <button type="button" class="btn2" id="moveDown" title="Move later in the row">Move ▶</button>
    <span class="spacer"></span>
    <button type="button" class="btn2" id="cancelPerson">Cancel</button>
    <button type="submit" class="btn2 blue">Save</button>
  </div>
</form></dialog>

<dialog id="acctDlg"><form method="dialog" id="acctForm">
  <h3>Account settings</h3>
  <div class="fgrid">
    <label class="full">Account name<input name="name" required></label>
    <label class="full">Slide title<input name="slideTitle"></label>
    <label>Support box on slide (blank = none)<input name="supportBox"></label>
    <label>Slide footer label<input name="footer"></label>
    <label class="full">Suggested entry order (one per line)<textarea name="entryOrder"></textarea></label>
    <label class="full">Still to validate (one per line)<textarea name="validationNotes"></textarea></label>
  </div>
  <div class="dlg-actions">
    <button type="button" class="btn2 danger" id="delAcct">Delete account</button>
    <button type="button" class="btn2" id="resetAcct" title="Restore the original validated people for this account">Reset people to defaults</button>
    <span class="spacer"></span>
    <button type="button" class="btn2" id="cancelAcct">Cancel</button>
    <button type="submit" class="btn2 blue">Save</button>
  </div>
</form></dialog>

<script src="data.js"></script>
<script src="vendor/pptxgen.bundle.js"></script>
<script src="pptx-export.js"></script>
<script src="app.js"></script>
</body>
</html>
